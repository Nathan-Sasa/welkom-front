<div
    class="w-full relative min-h-[75vh] max-h-180"
    >
    <div
        role="list"
        class="carousel relative"
        >
        @for (catalogue of catalogues(); track $index) {
            <article
                wlkEntryAnim
                [threshold]="0.2"
                [translateY]="10"
                aria-label="{{catalogue.name}} catalogue"
                [routerLink]="['/catalogues', catalogue.uuid]"
                class="carousel-item h-132 w-full max-w-76 flex flex-col gap-md opacity-0 cursor-pointer"
                >
                <div
                    class="h-14/16 w-full relative rounded-lg"
                    >
                    <img 
                        [src]="catalogue.catalogueImgUrl" 
                        alt="image {{catalogue.name}} catalogue"
                        class="w-full h-full border-3 border-background dark:border-clr-bg-container-cream rounded-xl "
                    >
                    <p
                        class="font-Semibold text-center mt-xs"
                        >
                        {{catalogue.name}}
                    </p>
                </div>
            </article>
        }    
    </div>
</div>
