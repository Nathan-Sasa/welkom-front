<section class="w-full">
    <div
        class="w-full flex items-center justify-between"
        >
        <p-button 
            label="retour"
            size="small"
            icon="pi pi-arrow-left"
            [text]="true"
            (onClick)="goBack()"
        />
    </div>
    <div
        class="w-full grid grid-cols-1 gap-lg"
        >
        <div
            class="flex items-center justify-center"
            >
            <p-avatar 
                [label]="initialAvatar()"
                size="xlarge"
                class="border! border-wlk-content-muted! *:text-h3! text-wlk-content-secondary! font-Semibold!"
            />
        </div>

        <div
            class="col-span-1 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 bg-wlk-surface-soft gap-md gap-y-xl lg:gap-y-big p-md rounded-md"
            >
            <fieldset
                class="flex relative justify-center"
                [disabled]="submitting()"
                >
                <label 
                    for="firstname"
                    class="w-full flex flex-col gap-sm">
                    <span>Prénom</span>
                    <p-iconfield
                        class="w-full!"
                        >
                        <p-inputicon class="pi pi-user" />
                        <input 
                            aria-label="prénom de l'invité"
                            pInputText
                            type="text"
                            [ngModel]="firstName()"
                            (ngModelChange)="firstName.set($event); submit.set('none'); submittingError.set(false)"
                            class="w-full!"
                        >
                    </p-iconfield>
                </label>
            </fieldset>

            <fieldset
                class="flex relative justify-center"
                [disabled]="submitting()"
                >
                <label 
                    for="lastName"
                    class="w-full flex flex-col gap-sm">
                    <span>Nom</span>
                    <p-iconfield
                        class="w-full!"
                        >
                        <p-inputicon class="pi pi-user" />
                        <input 
                            aria-label="nom de famille de l'invité"
                            pInputText
                            type="text"
                            [ngModel]="lastName()"
                            (ngModelChange)="lastName.set($event); submit.set('none'); submittingError.set(false)"
                            class="w-full!"
                        >
                    </p-iconfield>
                </label>
            </fieldset>

            <fieldset
                class="flex relative justify-center"
                [disabled]="submitting()"
                >
                <label 
                    for="lastName"
                    class="w-full flex flex-col gap-sm">
                    <span>Relation</span>
                    <p-iconfield
                        class="w-full!"
                        >
                        <p-inputicon class="pi pi-users" />
                        <p-select
                            aria-label="relation de l'invité"
                            inputId="category"
                            [options]="categories()"
                            optionLabel="name"
                            optionValue="value"
                            [ngModel]="category()"
                            (ngModelChange)="category.set($event); submit.set('none'); submittingError.set(false)"
                            [filter]="true"
                            placeholder="Categories"
                            class="pl-xl! w-full!"
                        />
                    </p-iconfield>
                </label>
            </fieldset>

            <fieldset
                class="flex relative justify-center"
                [disabled]="submitting()"
                >
                <label 
                    for="email"
                    class="w-full flex flex-col gap-sm">
                    <span>Email</span>
                    <p-iconfield
                        class="w-full!"
                        >
                        <p-inputicon class="pi pi-envelope" />
                        <input 
                            aria-label="email"
                            pInputText
                            type="text"
                            [ngModel]="email()"
                            (ngModelChange)="email.set($event); submit.set('none'); submittingError.set(false)"
                            class="w-full!"
                        >
                    </p-iconfield>
                </label>
            </fieldset>
            
            <fieldset
                class="flex relative justify-center"
                [disabled]="submitting()"
                >
                <label 
                    for="telephone"
                    class="w-full flex flex-col gap-sm">
                    <span>Téléphone</span>
                    <p-iconfield
                        class="w-full!"
                        >
                        <p-inputicon class="pi pi-mobile" />
                        <input 
                            aria-label="telephone"
                            pInputText
                            type="text"
                            [ngModel]="telephone()"
                            (ngModelChange)="telephone.set($event); submit.set('none'); submittingError.set(false)"
                            class="w-full!"
                        >
                    </p-iconfield>
                </label>
            </fieldset>

            <fieldset
                class="flex relative justify-center"
                [disabled]="submitting()"
                >
                <label 
                    for="lastName"
                    class="w-full flex flex-col gap-sm">
                    <span>Table</span>
                    <p-iconfield
                        class="w-full!"
                        >
                        <p-inputicon class="pi pi-users" />
                        <p-select
                            aria-label="assigner une table à l'invité"
                            inputId="table"
                            [options]="tables()"
                            optionLabel="name"
                            optionValue="value"
                            [ngModel]="table()"
                            (ngModelChange)="table.set($event); submit.set('none'); submittingError.set(false)"
                            [filter]="true"
                            placeholder="Table"
                            class="pl-xl! w-full!"
                        />
                    </p-iconfield>
                </label>
            </fieldset>
        </div>
        <div class="w-full flex justify-center py-md">
            <p-button 
                label="Ajouter l'invité(e)"
                size="small"
                (onClick)="submitGuest()"
                [disabled]="isFormInvalid()"
            />
        </div>

        <div class="w-full min-h-4">
            @if(submitting()){
                <div 
                    class="w-full flex justify-center">
                    <span 
                        wlkEntryAnim
                        [translateY]="50"
                        [delay]="300"
                        class="opacity-0 text-wlk-content-muted animate-pulse duration-500">
                        {{submittingMessage()}}
                    </span>
                </div>
            }
        </div>


        @if (submit() === 'submit') {
            <div class="w-full flex flex-col justify-start">
                <span class="flex items-center gap-xs">
                    <p-avatar 
                        shape="circle"
                        size="normal"
                        [icon]="createGuestStateIcon()"
                        [ngClass]="{
                            'border-wlk-content-muted/10! text-wlk-content-muted! bg-wlk-surface-soft/20!' : guestCreated() === 'creating',
                            'border-wlk-sage! text-wlk-sage! bg-wlk-surface-soft/50!': guestCreated() === 'created',
                            'border-wlk-danger/60! text-wlk-danger/60! bg-wlk-surface-soft/60!': guestCreated() === 'error'
                        }"
                        class="border text-label scale-70"
                    />
                    <p
                        [ngClass]="{
                            'text-wlk-content-muted' : guestCreated() === 'creating',
                            'text-wlk-sage': guestCreated() === 'created',
                            'text-wlk-danger/50': guestCreated() === 'error'
                        }"
                        class="text-label text-display"
                        >
                        {{creatingGuestMessage()}}
                    </p>
                </span>

                @if(isCreateTable()){
                    <span class="flex items-center gap-sm">
                    <p-avatar 
                        shape="circle"
                        size="normal"
                        [icon]="assignTableStateIcon()"
                        [ngClass]="{
                            'border-wlk-content-muted/10! text-wlk-content-muted! bg-wlk-surface-soft/20!' : assigningTable() === 'assigning',
                            'border-wlk-sage! text-wlk-sage! bg-wlk-surface-soft/50!': assigningTable() === 'assigned',
                            'border-wlk-danger/60! text-wlk-danger/60! bg-wlk-surface-soft/60!': assigningTable() === 'error'
                        }"
                        class="border text-label scale-70"
                    />
                    <p
                        [ngClass]="{
                            'text-wlk-content-muted' : assigningTable() === 'assigning',
                            'text-wlk-sage': assigningTable() === 'assigned',
                            'text-wlk-danger/50': assigningTable() === 'error'
                        }"
                        class="text-label text-display"
                        >
                        {{assigningTableMessage()}}
                    </p>
                </span>
                }
            </div>
        }

        @if(submittingError() && !submitting()){
            <div
                class="w-full"
                >
                <wlk-errors 
                    [wlkError]="errorContent()"
                />
            </div>
        }
    </div>
</section>
