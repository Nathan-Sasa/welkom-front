<ng-container 
    *wlkRole="['WLK_USER', 'WLK_ADMIN', 'WLK_SUPER_ADMIN']"
    >
    <section class="app-layout container" [class.menu-collapsed]="isMenuCollapsed">
            <!-- (toggle)="onMenuToggle($event)"  -->
        <wlk-side-menu 
            [toggle]="isCollapsed()"
            class="max-lg:hidden!"
        />
    
        <div class="right-container">
            <header 
                role="banner"
                class="top-header flex items-center justify-between">
                <div class="flex items-center gap-sm">
                    <button class="hidden lg:flex items-center justify-center toggle-btn *:text-wlk-content-muted *:hover:text-wlk-content *:transition *:duration-200" (click)="toggleMenu()">
                        <i [class]=" isCollapsed() ? 'pi pi-caret-right' : 'pi pi-caret-left'"></i>
                        <!-- {{ isCollapsed ? 'pi-caret-right' : 'pi-caret-left' }} -->
                    </button>
                    <button 
                        pButton
                        icon="pi pi-folder"
                        size="small"
                        severity="secondary"
                        [text]="true"
                        class="lg:hidden!"
                        (click)="isMenuDrawer = true"
                        ></button>
                    <wlk-theme class="mr-xs" />
                </div>
                <a 
                    routerLink="/profile"
                    aria-label="Profile de {{auth.currentUser()!.username}}"
                    class="flex items-center gap-sm"
                    >
                    <span class="font-semibold">
                        {{auth.currentUser()!.username}}
                    </span>
                    <p-avatar 
                        image="assets/shapes/default-profile.svg"
                        shape="circle"
                    />
                </a>
            </header>
    
            <main class="main-content relative">
                <router-outlet></router-outlet>
            </main>
        </div>
    </section>

    
    <p-drawer 
        [header]="'Welkom'" 
        [(visible)]="isMenuDrawer" 
        position="left"
        [closeButtonProps]="{icon: 'pi pi-folder', iconPos: 'right', size: 'small', text: true}"
        >
        <div class="w-full h-full flex flex-col justify-between">
            <nav
                class="w-full max-w-56 h-full flex flex-col justify-start"
                >
                @for (item of menuItems; track $index) {
                    <a  
                        [ariaLabel]="item.label"
                        [routerLink]="item.route" 
                        routerLinkActive="active cursor-default" 
                        (click)="isMenuDrawer = false"
                        class="menu-item"
                        >
                        <span class="icon flex items-center text-center h-5 min-w-4">
                            <i [class]="item.icon"></i>
                        </span>
                            <span 
                                class="label text-label"
                                >
                                {{ item.label }}
                            </span>
                    </a>
                }
            </nav>
        </div>
    </p-drawer>
</ng-container>
