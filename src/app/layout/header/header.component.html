<header
    aria-label="site-header"
    role="banner"
    class="w-full pr-4 fixed top-0 z-200 flex items-center justify-between bg-wlk-background || "
    >
    <div
        class="flex otems-center gap-4"
        >
        <a
            routerLink="/"
            aria-label="Welkom – Home"
            class="flex items-center gap-sm"
            >
            <img 
                src="assets/logo/welkom-logo-text.webp" 
                alt=""
                width="160"
                >
            <!-- <wlk-welkom-logo [size]="36"></wlk-welkom-logo>
            <span class="title-3"> {{appInfo.name}}</span> -->
        </a>
        <div
            class="w-12 scale-50 list-none flex items-center justify-center">
            <app-theme></app-theme>
        </div>
    </div>

    <nav
        aria-label="Main navigation"
        class="lg:w-3/5 xl:w-1/2 hidden lg:flex items-center justify-between"
        >
        <ul
            class="flex items-center gap-sm "
            >
            <li>
                <a 
                    pButton
                    size="small"
                    [text]="true"
                    severity="secondary"
                    [routerLink]="['/home']"
                    [routerLinkActive]="['text-wlk-primary!']"
                    variant="simple"
                    class="button tertial"
                    >
                    <!-- [routerLinkActiveOptions]="{exact: true}" -->
                    Acceuil
                </a>
            </li>
            <li>
                <a 
                    pButton
                    size="small"
                    [text]="true"
                    severity="secondary"
                    [routerLink]="['/catalogues']"
                    [routerLinkActive]="['text-wlk-primary!']"
                    variant="simple"
                    class="text-wlk-primary"
                    >
                    Templates
                </a>
            </li>
            <li>
                <a 
                    *wlkRole="['WLK_ADMIN', 'WLK_SUPER_ADMIN']"
                    pButton
                    size="small"
                    [text]="true"
                    severity="secondary"
                    [routerLink]="['/admin']"
                    [routerLinkActive]="['link']"
                    class="button tertial"
                    >
                    Admin
                </a>
            </li>
            <li>
                <a 
                    *wlkRole="['WLK_ADMIN', 'WLK_SUPER_ADMIN']"
                    pButton
                    size="small"
                    [text]="true"
                    severity="secondary"
                    [routerLink]="['/design-system']"
                    [routerLinkActive]="['link']"
                    class="button tertial"
                    >
                    Design
                </a>
            </li>
        </ul>
        <ul
            class="flex items-center gap-sm"
            >
            <ng-container 
                *wlkRole="['WLK_USER', 'WLK_ADMIN', 'WLK_SUPER_ADMIN']"
                >
                <a 
                    routerLink="/profile"
                    aria-label="Profile de {{auth.currentUser()!.username}}"
                    class="flex items-center gap-sm"
                    >
                    <span class="font-semibold">
                        {{auth.currentUser()!.username}}
                    </span>
                    <p-avatar 
                        image="assets/shapes/default-profile.svg"
                        shape="circle"
                    />
                </a>
            </ng-container>
            <ng-container
                *wlkRole="'GUEST'"
                >
                <a 
                    pButton
                    size="small"
                    icon="pi pi-user"
                    severity="primary"
                    [routerLink]="['/auth/login']"
                    class="button primary"
                    >
                    Se connecter
                </a>
            </ng-container>
        </ul>
    </nav>

    <p-button (click)="isMenuOpen = true" icon="pi pi-bars" class="2xl:scale-150! lg:hidden!" />
</header>

<p-drawer [header]="appInfo.name" [(visible)]="isMenuOpen" position="right">
    <nav
        class="w-full h-full flex flex-col justify-between"
        >
    </nav>
</p-drawer>
