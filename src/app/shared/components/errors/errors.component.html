<div
    class="w-full"
    >
    @switch(wlkError().status) {
        @case(500){
            <div
                class="border-2 border-dashed border-wlk-danger/50 rounded-lg bg-wlk-danger/10 p-main"
                >
                <span class="font-Semibold">{{wlkError().error.message}}</span>
            </div>
        }
        @case(409){
            <p-tag
                wlkEntryAnim
                [translateY]="15"
                [delay]="250"
                severity="warn"
                class="opacity-0 w-full!"
                >
                {{wlkError().error.message}}
            </p-tag>
        }
        @case (403) {
            <p-tag
                wlkEntryAnim
                [translateY]="15"
                [delay]="250"
                severity="warn"
                class="opacity-0 w-full!"
                >
                {{wlkError().error.message}}
            </p-tag>
        }
    }
</div>
